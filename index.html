<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your personal travel map — mark places you've visited and dream destinations around the world." />
    <script>
      try {
        var raw = localStorage.getItem('travel-map-storage-v1');
        var dark;
        if (raw) {
          var parsed = JSON.parse(raw);
          dark = parsed.state && parsed.state.preferences && parsed.state.preferences.darkMode;
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <title>Travel Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
